    <script>
      (() => {
        if (performance.getEntriesByType('navigation')[0]?.type !== 'reload' || !('scrollRestoration' in history)) return;
        const previousRestoration = history.scrollRestoration;
        const originalUrl = location.href;
        const initialUrl = originalUrl.split('#')[0];
        const inputs = ['pointerdown', 'keydown', 'wheel', 'touchstart', 'hashchange', 'popstate'];
        let interacted = false, complete = false, frame = 0;
        const markInteraction = () => { interacted = true; };
        const resetTop = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        const finish = (reset) => {
          if (complete) return;
          complete = true;
          const unchanged = location.href === initialUrl;
          if (unchanged && originalUrl !== initialUrl) history.replaceState(history.state, '', originalUrl);
          if (reset && !interacted && unchanged) resetTop();
          history.scrollRestoration = previousRestoration;
          cancelAnimationFrame(frame);
          inputs.forEach(type => window.removeEventListener(type, markInteraction));
          window.removeEventListener('pageshow', onShow);
          window.removeEventListener('pagehide', onHide);
        };
        const onShow = () => {
          if (!interacted && location.href === initialUrl) resetTop();
          frame = requestAnimationFrame(() => finish(true));
        };
        const onHide = () => finish(false);
        // Prevent both reload restoration and a reload's fragment jump before paint.
        history.scrollRestoration = 'manual';
        if (originalUrl !== initialUrl) history.replaceState(history.state, '', initialUrl);
        resetTop();
        inputs.forEach(type => window.addEventListener(type, markInteraction, { passive: true }));
        window.addEventListener('pageshow', onShow, { once: true });
        window.addEventListener('pagehide', onHide, { once: true });
      })();
    </script>
